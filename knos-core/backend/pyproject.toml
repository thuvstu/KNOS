[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knos-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.28.0",
  "google-generativeai>=0.8.0",
  "structlog>=24.4.0",
  "python-multipart>=0.0.18",
  "python-jose[cryptography]>=3.3.0",
  "trafilatura>=2.0.0",
  "pdfplumber>=0.11.4",
  "python-docx>=1.1.2",
  "pillow>=11.0.0",
  "pgvector>=0.3.6",
  "geoalchemy2>=0.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]

